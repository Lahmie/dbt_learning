models:
  - name: base_payment_method
    description: This is the base model for the payment method table
    columns:
    - name: payment_method_id
      description: "The unique identifier for each payment method. Primary key for this table"
      tests:
        - unique
        - not_null
    - name: payment_method
      description: "The name of the payment method."
      tests:
        - not_null
        - accepted_values:
            arguments:
              values:
                - "credit card"
                - "debit card"
                - "cash"
                - "net banking"
                - "upi"