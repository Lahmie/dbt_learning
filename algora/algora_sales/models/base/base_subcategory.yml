models:
  - name: base_subcategory
    description: "This is the base model for the subcategory table"
    columns:
      - name: subcategory_id
        description: "The unique identifier for each subcategory. Primary key for this table"
        tests:
          - unique
          - not_null
      - name: subcategory_name
        description: "The name of the subcategory."
        tests:
          - not_null
      - name: category_id
        description: "The identifier for the category to which the subcategory belongs. Foreign key referencing the category table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('base_category')
                field: category_id