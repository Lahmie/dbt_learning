models:
  - name: dim_property
    description: "Property dimension table containing property details with type and location attributes, with a surrogate key."
    columns:
      - name: property_key
        description: "Surrogate key for the property dimension, generated from property_id."
        tests:
          - unique
          - not_null
      - name: property_id
        description: "The natural key for the property sourced from the transactional system."
        tests:
          - unique
          - not_null
      - name: address
        description: "The street address of the property."
        tests:
          - not_null
      - name: type_name
        description: "The descriptive name of the property type."
        tests:
          - not_null
      - name: category
        description: "The category the property type belongs to (e.g. residential, commercial)."
        tests:
          - not_null
      - name: suburb_name
        description: "The suburb where the property is located."
        tests:
          - not_null
      - name: postcode
        description: "The postcode of the property's suburb."
        tests:
          - not_null
      - name: state
        description: "The state where the property is located."
        tests:
          - not_null
      - name: region
        description: "The region where the property is located."
        tests:
          - not_null
