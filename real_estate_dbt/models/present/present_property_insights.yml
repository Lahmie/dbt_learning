models:
  - name: present_property_insights
    description: "Monthly average property price by type and region, for completed transactions."
    columns:
      - name: type_name
        description: "The descriptive name of the property type."
        tests:
          - not_null
      - name: region
        description: "The region where the properties are located."
        tests:
          - not_null
      - name: transaction_month
        description: "The first day of the month in which the transactions were completed."
        tests:
          - not_null
      - name: avg_price
        description: "The average sale price for that property type, region, and month."
        tests:
          - not_null
