models:
  - name: base_db_transactions
    description: "This is the base model for the db_transactions table"
    columns:
      - name: transaction_id
        description: "The unique identifier for each transaction. Primary key for this table"
        tests:
          - unique
          - not_null
      - name: property_id
        description: "The unique identifier for each property. Foreign key referencing the properties table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('base_db_properties')
                field: property_id
      - name: agent_id
        description: "The unique identifier for each agent. Foreign key referencing the agents table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('base_db_agents')
                field: agent_id
      - name: client_id
        description: "The unique identifier for each client. Foreign key referencing the clients table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('base_db_clients')
                field: client_id                    
      - name: status_id
        description: "The unique identifier for each status. Foreign key referencing the status table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('base_db_status')
                field: status_id
      - name: price
        description: "The price of the property."
        tests:
          - not_null
      - name: transaction_create_time
        description: "The timestamp when the transaction was created."
      - name: transaction_complete_time
        description: "The timestamp when the transaction was completed."