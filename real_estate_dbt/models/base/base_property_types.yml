models:
  - name: base_property_types
    description: "This is the base model for the property_types table"
    columns:
      - name: type_code
        description: "The code identifier for each property type. Primary key for this table"
        tests:
          - unique
          - not_null
      - name: type_name
        description: "The name of the property type."
        tests:
          - not_null
      - name: category
        description: "The category of the property type (e.g., Residential, Commercial)."
        tests:
          - not_null