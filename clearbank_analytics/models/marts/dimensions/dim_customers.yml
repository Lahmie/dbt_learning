version: 2

models:
  - name: dim_customers
    description: >
      Type 2 slowly changing dimension for customers, sourced from the snap_customers
      snapshot. One row per customer per historical version — a new row is added whenever
      a tracked attribute (address, contact info, KYC status, etc.) changes. Conformed —
      used by fct_transactions, fct_loan_repayments and fct_loan_disbursement.
    columns:
      - name: customer_key
        description: Surrogate key. Primary key — unique per customer per historical version.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural/business key from the source system. Not unique — repeats across historical versions of the same customer.
        tests:
          - not_null
      - name: first_name
        tests:
          - not_null
      - name: middle_name
        description: Nullable — not all customers have a middle name on record.
      - name: last_name
        tests:
          - not_null
      - name: email
        tests:
          - not_null
      - name: phone_number
        tests:
          - not_null
      - name: date_of_birth
        tests:
          - not_null
      - name: address
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: nationality
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              values: [male, female, other]
      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: [pending, verified, rejected]
      - name: created_at
        description: Timestamp the customer record was originally created.
        tests:
          - not_null
      - name: valid_from
        description: Timestamp this version of the customer record became active.
        tests:
          - not_null
      - name: valid_to
        description: Timestamp this version of the customer record was superseded. Null for the current version.
      - name: is_current
        description: True if this row is the current version of the customer record.
        tests:
          - not_null
