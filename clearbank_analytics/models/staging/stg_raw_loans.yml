version: 2

models:
  - name: stg_raw_loans
    description: This is the staging model for raw loans. One row per loan application.
    columns:
      - name: loan_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: product_type
        tests:
          - not_null
      - name: applied_amount
        tests:
          - not_null
      - name: approved_amount
        description: Nullable — null if the loan was never approved.
      - name: disbursed_amount
        description: Nullable — null if the loan was never disbursed.
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: [applied, approved, disbursed, closed, defaulted]
      - name: application_date
        tests:
          - not_null
      - name: approval_date
        description: Nullable — null if the loan was never approved.
      - name: disbursement_date
        description: Nullable — null if the loan was never disbursed.
      - name: created_at
        tests:
          - not_null
      - name: updated_at
        tests:
          - not_null
