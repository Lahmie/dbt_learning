version: 2

models:
  - name: int_transactions_enriched
    description: >
      Transactions joined to accounts to resolve customer_id.
      One row per transaction event.
    columns:
      - name: transaction_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: customer_id
        description: Derived from accounts via account_id.
        tests:
          - not_null
      - name: card_id
        description: Nullable — only populated for card-based transactions.
      - name: transaction_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: type
        tests:
          - not_null
          - accepted_values:
              values: [debit, credit]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: [completed, pending, reversed]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: [atm, pos, mobile, web, transfer]
      - name: reference_number
        tests:
          - not_null
      - name: description
        description: Free-text transaction description. Nullable.
      - name: reversal_of_transaction_id
        description: Nullable — populated only for reversal transactions.
      - name: transaction_created_at
        tests:
          - not_null
